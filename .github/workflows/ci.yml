name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: blacksmith-4vcpu-ubuntu-2404
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]
        extras: ["dev"]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install
        run: pip install -e ".[${{ matrix.extras }},transport]"
      - name: Lint
        run: ruff check src/constitutional_swarm/
      - name: Test
        env:
          OPENAI_API_KEY: test-key-for-unit-tests
          ANTHROPIC_API_KEY: test-key-for-unit-tests
        run: |
          python -m pytest tests/ \
            --import-mode=importlib \
            -m "not slow and not benchmark and not e2e and not research and not bittensor" \
            -v --tb=short

  typecheck:
    runs-on: blacksmith-4vcpu-ubuntu-2404
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
      # no-extras surface: this is the published-library distribution contract —
      # the package must type-check with no optional deps installed. Type errors
      # that only surface once an extra's real (py.typed) types resolve are NOT
      # visible here; the typecheck-transport job below covers that surface.
      - name: Install
        run: pip install -e ".[dev]"
      - name: Type-check
        run: mypy

  typecheck-transport:
    runs-on: blacksmith-4vcpu-ubuntu-2404
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
      # transport surface: websockets ships py.typed, so installing it lets mypy
      # resolve the real types in transport-gated modules (e.g. gossip_protocol,
      # remote_vote_transport) that the no-extras job cannot see. This is where
      # env-sensitive type errors are caught — matching the local `make typecheck`
      # default (EXTRAS="dev transport").
      - name: Install
        run: pip install -e ".[dev,transport]"
      - name: Type-check
        run: mypy

  test-postgres:
    runs-on: blacksmith-4vcpu-ubuntu-2404
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_DB: apcc_test
          POSTGRES_HOST_AUTH_METHOD: trust
          POSTGRES_USER: apcc
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U apcc -d apcc_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      APCC_POSTGRES_DSN: host=127.0.0.1 port=5432 dbname=apcc_test user=apcc
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
      - name: Configure PostgreSQL 17 contention capacity
        run: |
          service_id="${{ job.services.postgres.id }}"
          docker exec "$service_id" \
            psql -v ON_ERROR_STOP=1 -U apcc -d apcc_test \
            -c "ALTER SYSTEM SET max_connections = '200'"
          docker restart "$service_id"
          for attempt in {1..30}; do
            if docker exec "$service_id" pg_isready -U apcc -d apcc_test; then
              break
            fi
            if [[ "$attempt" == 30 ]]; then
              echo "PostgreSQL did not become ready after restart" >&2
              exit 1
            fi
            sleep 1
          done
          test "$(docker exec "$service_id" psql -At -U apcc -d apcc_test \
            -c "SHOW server_version_num")" -ge 170000
          test "$(docker exec "$service_id" psql -At -U apcc -d apcc_test \
            -c "SHOW server_version_num")" -lt 180000
          test "$(docker exec "$service_id" psql -At -U apcc -d apcc_test \
            -c "SHOW max_connections")" -eq 200
      - name: Install with PostgreSQL support
        run: pip install -e ".[dev,postgres]"
      - name: Type-check PostgreSQL backend
        run: mypy src/constitutional_swarm/apcc/postgres_store.py tests/test_apcc_postgres.py
      - name: Test PostgreSQL authority store without skips
        run: |
          python -m pytest -q tests/test_apcc_postgres.py \
            --import-mode=importlib --junitxml=postgres-results.xml
          python - <<'PY'
          import xml.etree.ElementTree as ET

          root = ET.parse("postgres-results.xml").getroot()
          skipped = sum(
              int(suite.attrib.get("skipped", "0"))
              for suite in root.iter("testsuite")
          )
          if skipped:
              raise SystemExit(f"PostgreSQL suite skipped {skipped} test(s)")
          PY

  test-research:
    runs-on: blacksmith-4vcpu-ubuntu-2404
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
      - name: Install with research extras
        run: pip install -e ".[dev,research,transport]"
      - name: Test research stack
        env:
          OPENAI_API_KEY: test-key-for-unit-tests
          ANTHROPIC_API_KEY: test-key-for-unit-tests
        run: |
          python -m pytest tests/ \
            --import-mode=importlib \
            -m "not slow and not benchmark and not e2e" \
            -v --tb=short

  package:
    runs-on: blacksmith-4vcpu-ubuntu-2404
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
      - name: Install build tools
        run: pip install build twine
      - name: Build
        run: python -m build --wheel --sdist
      - name: Validate
        run: twine check dist/*
      - name: Smoke test wheel install
        run: pip install dist/*.whl && python -c "import constitutional_swarm; print('import OK')"

  test-extras-bittensor:
    runs-on: blacksmith-4vcpu-ubuntu-2404
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
      - name: Install with bittensor extras
        run: |
          pip install -e ".[dev,bittensor]"
          pip uninstall scalecodec -y || true
          pip install cyscale --force-reinstall
      - name: Verify bittensor extras import
        run: python -c "from constitutional_swarm.bittensor.protocol import MinerConfig; print('bittensor extras OK')"

  test-extras-transport:
    runs-on: blacksmith-4vcpu-ubuntu-2404
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
      - name: Install with transport extras
        run: pip install -e ".[dev,transport]"
      - name: Verify transport extras import
        run: python -c "from constitutional_swarm.gossip_protocol import GossipNode; print('transport extras OK')"
