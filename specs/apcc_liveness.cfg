CONSTANT Ablation = "SAFE"
SPECIFICATION LivenessSpec
INVARIANT Invariant
PROPERTY ValidStableProposalEventuallyCommits
PROPERTY AdmittedProposalEventuallyTerminates
PROPERTY DeniedProposalEventuallyReturnsDenial
PROPERTY ConflictingProposalEventuallyReturnsConflict
PROPERTY IdempotentRetryEventuallyReturnsDecision
PROPERTY RevocationEventuallyPropagates
PROPERTY CommittedCertificateEventuallyBecomesReadable
PROPERTY OutboxIntentEventuallyDelivered
PROPERTY ResponseLossEventuallyRecovers
