[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "constitutional-swarm"
version = "1.1.0"
description = "Constitutional Swarm Mesh — orchestrator-free multi-agent governance via embedded Agent DNA"
readme = "README.md"
requires-python = ">=3.11"
license = "AGPL-3.0-or-later"
authors = [{name = "ACGS Team", email = "hello@acgs.dev"}]
# acgs-lite >=2.8.1 required: top-level exports of constitution lifecycle
# symbols (CaseManager, SpotCheckAuditor, TrustScoreManager, ValidatorSelector,
# and related). Shipped in acgs-lite v2.8.1 via PRs #9 and #10.
dependencies = [
  "acgs-lite>=2.8.1",
  "cryptography>=44.0.2",
  "pydantic>=2,<3",
]

[project.urls]
Homepage = "https://acgs.ai"
Documentation = "https://github.com/dislovelhl/Acgs-Swarm#readme"
Repository = "https://github.com/dislovelhl/Acgs-Swarm"
Issues = "https://github.com/dislovelhl/Acgs-Swarm/issues"
Changelog = "https://github.com/dislovelhl/Acgs-Swarm/releases"
PyPI = "https://pypi.org/project/constitutional-swarm/"

[project.optional-dependencies]
# mypy bounded to 2.x: 1.x emits env-unstable false positives (e.g. the
# transport.py:133 artifact that vanishes under 2.x) and a langgraph-triggered
# internal crash; an unbounded upper edge would let a future release flip the
# gate non-deterministically — counter to this gate's env-consistency contract.
# ruff bounded below 0.16: 0.16.0 expands the default rule set (BLE001, TRY004,
# PERF402, RUF100, ...) and flips the lint gate red with 54 findings on a tree
# that is clean under 0.15.x (uv.lock pins 0.15.12). Same env-consistency
# rationale as the mypy bound; raise deliberately alongside a lint-clean pass.
dev = [
  "pytest>=8.0",
  "pytest-asyncio>=0.24",
  "ruff>=0.4,<0.17",
  "mypy>=2,<3",
  "numpy>=1.24",
  # scripts/agent_check.py (make agent-check / CI agent-operability) imports
  # these directly. They used to arrive transitively via numpy/braintrust and
  # vanished once those left the default extra graph.
  "jsonschema>=4.18",
  "pyyaml>=6.0",
]
# Observability for testnet/eval scripts only (scripts/testnet_deploy.py).
# Not imported by the runtime; pytest still disables the plugin via addopts.
braintrust = ["braintrust==0.31.0"]
# bittensor bounded below 11: v11 removed the miner/validator networking stack
# (axon/dendrite/synapse) that synapse_adapter.py, axon_server.py, and
# dendrite_client.py build on (bt.Synapse access raises AttributeError).
# Migrating to the v11 ServeAxon/http_auth model is a separate project; the
# uv.lock known-good is 10.2.0.
bittensor = ["bittensor>=7.0,<11"]
transport = ["websockets>=12.0"]
# PostgreSQL 17 APCC authority-store backend. The default SQLite backend and
# package import surface do not require a PostgreSQL driver.
postgres = ["psycopg[binary]>=3.2,<4"]
# research: MCFS research stack (latent DNA steering, swarm ODE dynamics)
research = ["torch>=2.0", "transformers>=4.40", "numpy>=1.24"]
# deprecated alias — use research instead
latent = ["constitutional-swarm[research]"]
# finetune: trainer stack for the extended-refusal fine-tuning *reference recipe*
# (docs/recipes/extended_refusal_finetuning.md). Opt-in and OUT of the test matrix —
# scripts/finetune_extended_refusal.py imports these but is never collected by CI.
# Composes with [research] (torch/transformers). The library's only CI-gated piece is
# the measurement (abliteration_detector.refusal_distribution_score), which needs
# none of this. See docs/internal/abliteration_threat_model.md (Follow-ups → #2).
finetune = ["constitutional-swarm[research]", "trl>=0.9", "peft>=0.11"]
# semantic: cross-encoder role-drift detection (option-c hardening)
# Adds a 4th detection channel via sentence-transformers' CrossEncoder over
# MCFS_ROLE_CONSTITUTION canonical phrases. Bi-encoder cosine was tested and
# rejected: no separation window between synonym attacks and lexical-overlap
# benign payloads (calibration in
# .omc/autoresearch/monotonic-mas-coordination/runs/run-adversarial-2026-05-08-postfix).
# Cross-encoder takes the (payload, anchor) pair as input and disambiguates
# intent direction natively. Default model BAAI/bge-reranker-base (~280MB,
# Apache-2.0). Optional; detect_role degrades to current behavior if not installed.
semantic = ["sentence-transformers>=2.5"]
# vertex: Claude on Google Cloud Vertex AI for SWE-bench agents.
# Routes the SWEBenchAgent through AnthropicVertex (same Messages API surface)
# so runs use ADC instead of a direct Anthropic API key. Auth via
# `gcloud auth application-default login` or GOOGLE_APPLICATION_CREDENTIALS.
vertex = ["anthropic[vertex]>=0.84", "google-cloud-aiplatform>=1.50"]
# gemini: GeminiSWEBenchAgent uses the unified google-genai SDK (Vertex via
# vertexai=True). Distinct from the vertex extra above (which is Anthropic-on-
# Vertex, no genai SDK). Install both extras when running heterogeneous
# Claude+Gemini swarms via run_one_by_one --models.
gemini = ["google-genai>=0.3"]
# langgraph: LangChain/LangGraph agent runtime adapter. LangGraph is the outer
# message-passing shell wrapping the MCFS math kernel — graphs express multi-agent
# topologies (supervisor / network / handoff) while AgentDNA.validate, MerkleCRDT,
# swarm_ode, and evolution_log stay authoritative. See docs/langgraph_runtime.md.
langgraph = [
  "langgraph>=1.1.10,<1.3",
  "langgraph-checkpoint>=3.0.1",
  "langgraph-prebuilt>=1.0.5",
  "langchain>=1.0,<2.0",
  "langchain-core>=1.0,<2.0",
  "langchain-anthropic>=1.0",
]
# langgraph-swarm: optional handoff topology via langgraph-swarm. Pair with [langgraph].
langgraph-swarm = [
  "constitutional-swarm[langgraph]",
  "langgraph-swarm>=0.1.0",
]

[project.scripts]
acgs-agent-self-evolve = "constitutional_swarm.agent_self_evolve:main"
acgs-swarm = "constitutional_swarm.governed_handoff:main"
acgs-verify-receipts = "constitutional_swarm.governance_receipts_cli:main"

[tool.setuptools.packages.find]
where = ["src"]
include = ["constitutional_swarm*"]

[tool.mypy]
# Static type-check gate (BLOCKERS.md B3). Runs via `make typecheck` and two CI
# jobs (no-extras + typecheck-transport). Most unstubbed third-party deps
# (acgs-lite, braintrust, torch, transformers, bittensor, ...) are ignored as
# missing imports. NB: `websockets` (transport) and `langgraph`/`langchain` DO
# ship py.typed — installing those extras makes mypy resolve their real types, so
# the gate is environment-sensitive. `make typecheck-coverage` enforces that every
# py.typed extra is in a blocking typecheck job or excepted with a reason.
python_version = "3.11"
files = ["src/constitutional_swarm"]
ignore_missing_imports = true
warn_redundant_casts = true
# NB: warn_unused_ignores is intentionally OFF. The broad env-divergent ignore
# clusters (dna.py Z3 re-exports, violation_subspace numpy reads) are needed in
# some extra configurations and unused in others, so enabling it would flip-flop
# the gate by environment. (The `[import]` ignores on optional imports are already
# redundant under global ignore_missing_imports; re-enabling cleanly would need the
# `# type: ignore[code,unused-ignore]` idiom — deferred.)
# The whole package is now checked and must stay clean — there is no adoption
# allow-list. New regressions in any module fail the gate. See BLOCKERS.md B3.

[[tool.mypy.overrides]]
# acgs-lite is installed (workspace/PyPI) but ships no py.typed, so mypy follows
# it and reports its re-exported classes as untyped *variables* — "X is not valid
# as a type", "object not callable" — rather than treating them as Any like the
# other unstubbed deps. follow_imports=skip puts acgs-lite on the same footing as
# the missing-import deps and, crucially, makes the gate robust to acgs-lite
# version drift between the local workspace build and CI's PyPI wheel. (Newer
# acgs-lite builds may ship py.typed locally; the override is kept regardless, so
# the gate's verdict does not depend on which acgs-lite build is installed.)
module = ["acgs_lite", "acgs_lite.*"]
follow_imports = "skip"
follow_imports_for_stubs = true

[tool.constitutional_swarm.typecheck_coverage]
# Guardrail manifest (scripts/check_typecheck_coverage.py, `make typecheck-coverage`).
# Every extra in [project.optional-dependencies] must appear here so a new
# extra-gated module cannot silently escape the type-check surface. See DECISIONS.md.
#   "checked"  — type-bearing (ships py.typed, used in type positions); MUST be
#                installed by a blocking extra-specific typecheck CI job.
#   "excepted" — not type-checked by the gate; each needs a reason.
checked = ["postgres", "transport"]

[tool.constitutional_swarm.typecheck_coverage.excepted]
dev = "tooling only (pytest/ruff/mypy/numpy/jsonschema/pyyaml for tests + agent-check); not imported by the default runtime"
braintrust = "optional testnet/eval telemetry; pytest disables the plugin; not imported by src/"
bittensor = "bittensor ships no py.typed; installing adds no coverage over ignore_missing_imports"
research = "torch/transformers are heavy and crash mypy; low value-to-cost — follow_imports=skip if ever gated"
latent = "deprecated alias of research"
finetune = "research + trl/peft; heavy and out of the test matrix"
semantic = "sentence-transformers; heavy, stub-less"
vertex = "anthropic[vertex]/google-cloud-aiplatform; stub-less"
gemini = "google-genai; stub-less"
langgraph = "type-bearing but has a known live error (langgraph_runtime/swarm_topology.py:126) and a mypy-1.11 crash; graduation tracked in follow-up, not clean"
langgraph-swarm = "extends langgraph; same deferral"

[tool.pytest.ini_options]
addopts = ["-p", "no:braintrust"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
# "src" for the package; "." so tests that import scripts.* (e.g.
# test_governance_receipts, test_protocol_canonicalization) collect when
# pytest is run from the repo root. See BLOCKERS.md.
pythonpath = ["src", "."]
filterwarnings = [
  "ignore:Core Pydantic V1 functionality isn't compatible with Python 3.14 or greater.:UserWarning",
]
markers = [
  "slow: marks tests as slow (800+ agent scale)",
  "integration: marks cross-package integration tests",
  "contract: marks stable cross-package contract tests",
  "research: marks empirical research proof tests (expected to fail; excluded from release gating)",
  "bittensor: marks tests that exercise the Bittensor subnet integration (excluded from dev matrix)",
  "benchmark: marks performance benchmark tests",
  "e2e: marks end-to-end tests requiring live external services",
  "security: marks security regression tests (one test per audit finding — report auto-generated)"
]

# uv workspace dev resolver: when developing inside the govern-zone
# monorepo, resolve `acgs-lite` from `packages/acgs-lite` rather than PyPI.
# Published wheel metadata (the `dependencies` array above) is unchanged —
# external consumers still pin via `acgs-lite>=2.8.1` from PyPI.
# See docs/PLAN-MONOREPO.md §5 Phase 3.
[tool.uv.sources]
acgs-lite = { workspace = true }
